[flake8]
ignore =
    W503
exclude =
    tests/,
    */migrations/*,
    data/,
    venv/,
    .venv/,
    env/,
    backend/venv/,
    **/venv/**,
    **/.venv/**,
    **/env/**,
    **/site-packages/**,
    docs/,
    frontend/,
    infra/
per-file-ignores =
    */settings.py:E501
    */manage.py:E501
